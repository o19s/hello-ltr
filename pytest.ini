[pytest]
# Test discovery patterns
python_files = test_*.py
python_functions = test_*
testpaths = tests

# Output configuration
console_output_style = progress
addopts = 
    -v
    --tb=short
    --strict-markers
    --showlocals
    --reruns=2
    --reruns-delay=1
    -n 4
    # Enable live output streaming for notebook tests (disable output capture)
    # This allows real-time visibility into notebook execution
    -s

# Test markers for categorization
markers =
    solr: Solr-specific notebook tests
    elasticsearch: Elasticsearch-specific notebook tests
    opensearch: OpenSearch-specific notebook tests
    slow: Slow-running tests (detected by patterns or execution time > 60 seconds)
    setup: Setup notebooks that prepare test environments
    fast: Fast-running tests (< 1 minute)
    flaky: Flaky tests that may need retries (use @pytest.mark.flaky(reruns=N, reruns_delay=M) to override global retry settings)
    integration: Integration tests that require real-time output streaming
    e2e: End-to-end tests (notebook tests) that require real-time output streaming
    notebook-stream: Enable streaming output for notebook tests (default: True)
    notebook-fail-fast: Stop notebook execution on first error (default: False, set via NOTEBOOK_FAIL_FAST env var)

# Timeout configuration (requires pytest-timeout)
# Default: 5 minutes per test (fail fast if notebooks hang)
timeout = 300
timeout_method = thread

# Parallel execution settings (requires pytest-xdist)
# Enabled by default: -n auto (runs on all available CPU cores)
# Override with: pytest -n 1 (sequential) or pytest -n NUM (specific number of workers)
#
# Port conflict handling:
# - Each worker automatically gets unique ports (base_port + worker_id * 1000)
# - Ports are set in conftest.py:pytest_configure via get_worker_ports()
# - Workers log their assigned ports at startup
# - For Docker-based tests, consider using --dist loadgroup to group by engine

# Filter warnings from third-party libraries
# Suppress deprecation warnings from third-party libraries
# These are in the libraries' own code and will be fixed when the libraries update
filterwarnings =
    ignore::DeprecationWarning:pytz
    ignore::DeprecationWarning:dateutil
    ignore::DeprecationWarning:pyparsing.core
    ignore::DeprecationWarning:pyparsing
    # Suppress PytestReturnNotNoneWarning for test_notebook_patterns functions
    # These functions return error lists for use by main() while also working as pytest tests
    ignore::_pytest.python.PytestReturnNotNoneWarning

