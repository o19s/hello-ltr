name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.9"

    steps:
      - name: Set up Python environment
        id: setup
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security scanning tools
        run: |
          uv pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          uv run bandit -r ltr/ rre/ utils/ tests/ -f json -o bandit-report.json
          uv run bandit -r ltr/ rre/ utils/ tests/ -f txt
        continue-on-error: true

      - name: Run pip-audit vulnerability scan
        run: |
          uv run pip-audit --format json --output pip-audit-report.json
          uv run pip-audit --format text
        continue-on-error: true

      - name: Upload security scan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

      - name: Calculate build time
        uses: ./.github/actions/calculate-build-time
        with:
          start_time: ${{ steps.setup.outputs.start_time }}

      - name: Publish security scan summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            echo "✅ Bandit scan completed. See artifacts for detailed report." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Bandit scan report not generated." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f pip-audit-report.json ]; then
            echo "✅ pip-audit scan completed. See artifacts for detailed report." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ pip-audit scan report not generated." >> $GITHUB_STEP_SUMMARY
          fi

