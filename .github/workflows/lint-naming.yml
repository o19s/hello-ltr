name: Lint Naming Conventions

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  ruff-naming:
    name: Ruff PEP 8 Naming Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff naming checks on Python files
        run: |
          uv run ruff check --select N ltr/ rre/ utils/ tests/ *.py
        continue-on-error: false

      - name: Run Ruff naming checks on notebooks
        run: |
          uv run ruff check --select N notebooks/
        continue-on-error: false

