[tool.setuptools]
packages = ["ltr", "rre"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
# Packages to measure coverage for
source = ["ltr", "rre"]
# Files/directories to exclude from coverage
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/notebooks/*",
    "*/conftest.py",
    "*/runner.py",
]

[tool.coverage.report]
# Coverage thresholds (can be adjusted as coverage improves)
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
# Ruff configuration for linting and formatting
# See https://docs.astral.sh/ruff/configuration/

# Target Python version
target-version = "py39"

# Line length (matches formatter)
# Reduced from 100 to preserve multi-line formatting for readability
line-length = 88

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".pytest_cache",
    "stubs",  # Type stub files may not follow PEP 8 naming (must match third-party APIs)
]

[tool.ruff.lint]
# Enable preview mode solely so PLW1514 can be selected below.
# explicit-preview-rules keeps every *other* preview rule off, so this does not
# quietly opt the repo into unstable lints.
preview = true
explicit-preview-rules = true

# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    # Text files must declare their encoding. Without it Python uses the
    # platform default, which is cp1252 on Windows, so reading UTF-8 data
    # raises UnicodeDecodeError and writing it silently mangles non-ASCII.
    # See issue #67.
    "PLW1514",  # unspecified-encoding (preview)
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B904",  # Allow `raise` without specifying exception in `except` blocks
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Per-file ignores for type stubs (must match third-party API naming)
[tool.ruff.lint.per-file-ignores]
"stubs/**/*.pyi" = ["N801"]

[tool.ruff.format]
# Ruff formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["ltr", "rre"]
split-on-trailing-comma = true

[tool.pyright]
# Pyright type checking configuration
include = ["ltr", "rre", "utils", "tests", "stubs", "notebooks"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/venv",
    "**/build",
    "**/dist",
    "**/*.egg-info",
    "**/htmlcov",
    "**/.pytest_cache",
    "**/*.ipynb"
]
# Stub path for custom type stubs
stubPath = "stubs"
reportMissingImports = true
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = true
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportGeneralTypeIssues = true
reportPrivateImportUsage = "warning"
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportArgumentType = true
reportCallIssue = true
reportAttributeAccessIssue = true
pythonVersion = "3.9"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true

