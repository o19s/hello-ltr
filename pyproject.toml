    "appnope==0.1.2",
    "attrs==21.4.0",
    "backcall==0.2.0",
    "bleach==4.1.0",
    "certifi==2022.12.07",
    "chardet==4.0.0",
    "cycler==0.11.0",
    "Cython",
    "decorator==4.3.2",
    "defusedxml==0.5.0",
    "elasticsearch==7.16.2",
    "entrypoints==0.3",
    "graphviz==0.19.1",
    "idna==3.3",
    "ipykernel>=6.25.0",
    "ipython>=8.12.0",
    "ipython-genutils==0.2.0",
    "ipywidgets>=8.0.0",
    "jedi>=0.19.0",
    "Jinja2==3.0.3",
    "joblib==1.1.1",
    "jsonschema>=4.17.0",
    "jupyter",
    "jupyter-client>=8.0.0",
    "jupyter-console>=6.6.0",
    "jupyter-core>=5.0.0",
    "kiwisolver>=1.3.2",
    "Mako==1.1.6",
    "MarkupSafe==2.0.1",
    "matplotlib>=3.7.2",
    "mistune",
    "mizani==0.9.2",
    "nbconvert>=7.0.0",
    "nbformat>=5.9.0",
    "nbstripout>=0.6.0",
    "notebook>=7.0.0",
    "numpy>=1.24.0,<2.0.0",
    "opensearch-py==2.2.0",
    "pandas>=2.0.3",
    "pandocfilters==1.5.0",
    "parso==0.8.3",
    "pexpect==4.8.0",
    "pickleshare==0.7.5",
    "plotly==5.5.0",
    "plotnine==0.12.2",
    "prometheus-client==0.13.1",
    "prompt-toolkit>=3.0.41,<3.1.0",
    "ptyprocess==0.7.0",
    "Pygments==2.11.2",
    "pyparsing==3.0.7",
    "pyrsistent==0.18.1",
    "python-dateutil==2.8.2",
    "pytz==2021.3",
    "pyzmq==25.1.1",
    "qtconsole==5.2.2",
    "requests>=2.31.0",
    "scikit-learn>=1.3.2",
    "scipy>=1.11.0",
    "Send2Trash==1.8.0",
    "six==1.16.0",
    "terminado==0.13.1",
    "testpath==0.5.0",
    "threadpoolctl==3.1.0",
    "tornado==6.2",
    "tqdm==4.62.3",
    "traitlets==5.9.0",
    "urllib3==1.26.8",
    "wcwidth==0.2.5",
    "webencodings==0.5.1",
    "xgboost==1.7.6",
    # Testing dependencies
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-html>=4.1.0",
    "pytest-cov>=4.0.0",
    # Code quality
    "ruff>=0.14.9",
]

[tool.setuptools]
packages = ["ltr", "rre"]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
# Packages to measure coverage for
source = ["ltr", "rre"]
# Files/directories to exclude from coverage
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/notebooks/*",
    "*/conftest.py",
    "*/runner.py",
]

[tool.coverage.report]
# Coverage thresholds (can be adjusted as coverage improves)
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
# Ruff configuration for linting and formatting
# See https://docs.astral.sh/ruff/configuration/

# Target Python version
target-version = "py39"

# Line length (matches formatter)
line-length = 100

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".pytest_cache",
]

[tool.ruff.lint]
# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "B904",  # Allow `raise` without specifying exception in `except` blocks
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Ruff formatter configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["ltr", "rre"]
split-on-trailing-comma = true

